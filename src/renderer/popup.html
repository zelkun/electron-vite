<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<title>팝업 창</title>
		<style>
			body,
			html {
				margin: 0;
				height: 100%;
			}
			#searchBar {
				height: 40px;
				background: #eee;
				padding: 8px;
				display: flex;
				align-items: center;
			}
			#searchInput {
				flex: 1;
				padding: 4px 8px;
				font-size: 1rem;
			}
			#resetBtn {
				margin-left: 8px;
				padding: 4px 12px;
			}
			#popupWebView {
				width: 100%;
				height: calc(100% - 40px);
			}
		</style>
	</head>
	<body>
		<div id="searchBar">
			<input id="searchInput" type="text" placeholder="검색어 입력" />
			<button id="resetBtn">초기화</button>
		</div>
		<webview id="popupWebView" allowpopups></webview>

		<script>
			const webview = document.getElementById('popupWebView');
			const searchInput = document.getElementById('searchInput');
			const resetBtn = document.getElementById('resetBtn');

			// preload API 활용, 이벤트 수신 시 인자 제대로 전달됨
			window.popupAPI.on('load-popup-url', (url) => {
				webview.src = url;
			});

			window.popupAPI.on('search-reset', () => {
				searchInput.value = '';
				// 추가 초기화 작업 여기에
			});

			searchInput.addEventListener('input', () => {
				const query = searchInput.value;
				// 웹뷰 내부 검색 기능 연동 시 필요한 코드 추가 가능
			});

			resetBtn.addEventListener('click', () => {
				searchInput.value = '';
				// 필요 시 IPC로 팝업 본문 초기화 명령 등 추가 가능
			});

			// 내부 콘텐츠 완전 로드 시 아래 이벤트 발생
			webview.addEventListener('did-finish-load', () => {
				window.popupAPI.send('popup-webview-loaded');
			});
		</script>
	</body>
</html>
