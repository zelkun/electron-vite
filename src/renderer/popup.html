<!-- src/renderer/popup.html -->
<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<title>Popup Window</title>
		<style>
			html,
			body,
			#popupWebview {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<webview id="popupWebview" src="about:blank" style="width: 100%; height: 100%" webpreferences="nativeWindowOpen=true" allowpopups></webview>
		<script>
			const urlParams = new URLSearchParams(window.location.search);
			const url = urlParams.get('url') || 'about:blank';
			const webview = document.getElementById('popupWebview');
			const onload = () => {
				if (webview.getURL() === 'about:blank') webview.src = url;
			};

			webview.removeEventListener('dom-ready', onload);
			webview.addEventListener('dom-ready', onload);

			// IPC 통신: main에서 'show-page-search' 이벤트 수신 시 검색 UI를 띄우는 로직 구현(최소 단순 로직)
			window.popupAPI.on('show-page-search', () => {
				// 예: 검색 UI를 구현하거나 webview.findInPage() 호출 (별도 구현 권장)
				alert('페이지 내 검색 기능을 구현하세요.');
			});
		</script>
	</body>
</html>
